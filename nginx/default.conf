# Static site server for Cloud Run. Runs as the unprivileged nginx user and
# listens on 8080 (Cloud Run's default $PORT).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1k;   # static site: nothing legitimately uploads here

    # Cloud Run terminates TLS, so absolute redirects would point at http://.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # Only GET/HEAD make sense for a static site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Hidden files (.git, .env, …) must never be served even if copied in.
    location ~ /\. {
        return 404;
    }

    # Not /healthz: Cloud Run reserves paths ending in "z" on *.run.app.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        # HTML is revalidated on every visit so content updates show at once.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
